<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Test</title>
</head>
<body>

    <h1>Typing Test</h1>

    <p>10:00</p>

    <div>
        <h3>Passage</h3>
        <p id="passage">
            This is a typing test. The passage will appear here.
        </p>
    </div>

    <div>
        <h3>Type Here</h3>
        <textarea id="typingBox" rows="10" cols="60"></textarea>
    </div>

    <button>Finish Test</button>

</body>
</html>
